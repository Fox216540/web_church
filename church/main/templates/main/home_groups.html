<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Домашние группы — Церковь ЕХБ Валенсии</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root {
    --primary-blue: #1A4D8F;
    --light-blue: #EFF5FB;
}

body {
    margin: 0;
    font-family: Poppins, sans-serif;
    background: var(--light-blue);
}

/* HEADER */
.header {
    background: linear-gradient(rgba(0,0,0,.2), rgba(0,70,143,1)),
                url("/static/main/img/fon.jpg") center/cover;
    padding: 1.5rem;
    color: white;
}

.nav {
    max-width: 1200px;
    margin: auto;
    display: flex;
    justify-content: space-between;
}

.nav-links a {
    color: white;
    margin-left: 2rem;
    text-decoration: none;
}

/* PAGE HEADER */
.page-header {
    text-align: center;
    padding: 4rem 1rem 2rem;
}

.page-header h1 {
    color: var(--primary-blue);
}

/* GRID */
.groups-grid {
    max-width: 1100px;
    margin: auto;
    padding: 2rem;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2rem;
}

@media (max-width: 900px) {
    .groups-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .groups-grid {
        grid-template-columns: 1fr;
    }
}

/* CARD */
.group-card {
    background: white;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);
    overflow: hidden;
    transition: .3s;
}

.group-card:hover {
    transform: translateY(-8px);
}

.group-card img {
    width: 100%;
    height: 260px;
    object-fit: cover;
}

.group-info {
    padding: 1rem;
    text-align: center;
}

.group-info h3 {
    margin: .3rem 0;
    color: var(--primary-blue);
}

.meta {
    color: #777;
    font-size: .9rem;
}
</style>
</head>

<body>

<header class="header">
<nav class="nav">
    <div class="logo">
        <i class="fas fa-cross"></i> Церковь ЕХБ
    </div>
    <div class="nav-links">
        <a href="{% url 'home' %}">Главная</a>
        <a href="{% url 'home' %}#about">О нас</a>
        <a href="{% url 'home' %}#ministries">Служения</a>
        <a href="{% url 'home' %}#contact">Контакты</a>
    </div>
</nav>
</header>

<div class="page-header">
    <h1>Домашние группы</h1>
    <p>Малые группы для общения, молитвы и духовного роста</p>
</div>

<div class="groups-grid">

<div class="group-card">
    <img src="leader1.jpg">
    <div class="group-info">
        <h3>Иван Петров</h3>
        <p class="meta">📍 Valencia • 🕒 Среда 19:00</p>
    </div>
</div>

<div class="group-card">
    <img src="leader2.jpg">
    <div class="group-info">
        <h3>Алексей Смирнов</h3>
        <p class="meta">📍 Torrent • 🕒 Пятница 20:00</p>
    </div>
</div>

<div class="group-card">
    <img src="leader3.jpg">
    <div class="group-info">
        <h3>Мария Коваль</h3>
        <p class="meta">🌍 Online • 🕒 Понедельник 18:30</p>
    </div>
</div>

<div class="group-card">
    <img src="leader4.jpg">
    <div class="group-info">
        <h3>Сергей Кузнецов</h3>
        <p class="meta">📍 Paterna • 🕒 Суббота 17:00</p>
    </div>
</div>

</div>

</body>
</html>
