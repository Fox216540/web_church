<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Контент — Церковь ЕХБ Валенсии</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
{% load static %}
<link rel="stylesheet" href="{% static 'main/css/content.css' %}" />
<link rel="shortcut icon" href="{% static 'main/img/favicon.ico' %}" type="image/x-icon">


</head>

<body>

<header class="header">
        <nav class="nav">
            <div class="logo">
                <i class="fas fa-cross"></i>
                Церковь ЕХБ
            </div>
            <div class="nav-links" id="navLinks">
                <a href="{% url 'home' %}">Главная</a>
                <a href="{% url 'home' %}#about">О нас</a>
                <a href="{% url 'home' %}#sermons" class="active">Проповеди</a>
                <a href="{% url 'home' %}#ministries">Служения</a>
                <a href="{% url 'home' %}#events">События</a>
                <a href="{% url 'home' %}#contact">Контакты</a>
            </div>
            <i class="menu-toggle fas fa-bars"></i>
        </nav>
    </header>

<div class="page-header">
    <h1>Медиа-контент</h1>
    <p>Фото и видео с богослужений и мероприятий</p>
</div>

<div class="filters">
    <button class="filter-btn active" data-filter="all">Все</button>
    <button class="filter-btn" data-filter="photo">Фото</button>
    <button class="filter-btn" data-filter="video">Видео</button>
    <button class="filter-btn" data-filter="service">Богослужения</button>
    <button class="filter-btn" data-filter="events">Мероприятия</button>
</div>

<div class="content-grid">

<div class="media-card" data-category="photo service">
    <img src="/static/main/img/photo1.jpg">
    <div class="media-info">Воскресное служение</div>
</div>

<div class="media-card" data-category="photo events">
    <img src="/static/main/img/photo2.jpg">
    <div class="media-info">Молодёжная встреча</div>
</div>

<div class="media-card" data-category="video service">
    <video controls>
        <source src="/static/main/video/service1.mp4" type="video/mp4">
    </video>
    <div class="media-info">Проповедь пастора</div>
</div>

<div class="media-card" data-category="video events">
    <video controls>
        <source src="/static/main/video/event1.mp4" type="video/mp4">
    </video>
    <div class="media-info">Рождественский концерт</div>
</div>

</div>

<footer class="footer">
    © 2024 Церковь ЕХБ
</footer>

<script src="{% static 'main/js/content.js' %}"></script>

</body>
</html>
