version: '3.8'

services:
  db:
    image: postgres:17.3  # Используем последнюю версию PostgreSQL
    container_name: church-db
    env_file:
      - ".env"  # Используем переменные окружения из файла .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}  # Переменные из .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - my_network
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Сохраняем данные PostgreSQL
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB'" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    working_dir: /church
    command: bash -c "python manage.py makemigrations && python manage.py migrate && python manage.py shell -c \"import os; from django.contrib.auth import get_user_model; User=get_user_model(); u=os.environ.get('ADMIN_USER'); e=os.environ.get('ADMIN_EMAIL'); p=os.environ.get('ADMIN_PASSWORD'); User.objects.filter(username=u).exists() or User.objects.create_superuser(u,e,p)\" && python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    networks:
      - my_network
    volumes:
      - ./log/web:/church/logs
      - static_data:/church/staticfiles
      - media_data:/church/media
    depends_on:
      db:
        condition: service_healthy

  photo:
    build: .
    container_name: church-photo
    working_dir: /church
    command: bash -c "while true; do python photo/photo.py; sleep 86400; done"
    env_file:
      - .env
    networks:
      - my_network
    volumes:
      - ./auth:/church/photo/auth
      - ./log/photo:/church/logs
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: church-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./cert:/etc/nginx/cert:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    networks:
      - my_network
    depends_on:
      - web

networks:
  my_network:
    driver: bridge

volumes:
  postgres_data:  # Том для хранения данных PostgreSQL
  static_data:
  media_data:
