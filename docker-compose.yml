services:
  db:
    image: postgres:17.3  # Используем последнюю версию PostgreSQL
    container_name: church-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks:
      - my_network
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Сохраняем данные PostgreSQL
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB'" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    working_dir: /church
    command: sh /church/scripts/start-web.sh
    environment:
      DEBUG: ${DEBUG:-False}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      IP_HOST: ${IP_HOST:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      ADMIN_USER: ${ADMIN_USER:?set ADMIN_USER in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - postgres_password
      - django_secret_key
      - admin_password
    networks:
      - my_network
    volumes:
      - ./log/web:/church/logs
      - static_data:/church/staticfiles
      - media_data:/church/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=3)\"" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  photo:
    build: .
    container_name: church-photo
    restart: unless-stopped
    working_dir: /church
    command: bash -c "while true; do python photo/photo.py; sleep 86400; done"
    environment:
      DEBUG: ${DEBUG:-False}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      IP_HOST: ${IP_HOST:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      CHAT_ID: ${CHAT_ID:-0}
      DRIVE_SHARED_DRIVE_ID: ${DRIVE_SHARED_DRIVE_ID:-}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      BOT_TOKEN_FILE: /run/secrets/bot_token
    secrets:
      - postgres_password
      - django_secret_key
      - bot_token
    networks:
      - my_network
    volumes:
      - ./auth:/church/photo/auth
      - ./log/photo:/church/logs
      - ./state/photo:/church/state
    depends_on:
      web:
        condition: service_healthy

  support-bot:
    build: .
    container_name: church-support-bot
    restart: unless-stopped
    working_dir: /church
    command: bash -c "python support_bot.py"
    environment:
      CHAT_ID: ${CHAT_ID:?set CHAT_ID in .env}
      BOT_TOKEN_HELP_FILE: /run/secrets/bot_token_help
    secrets:
      - bot_token_help
    networks:
      - my_network
    volumes:
      - ./log/support-bot:/church/logs
      - ./state/support-bot:/church/state

  caddy:
    image: caddy:2.10.2-alpine
    container_name: church-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - my_network
    depends_on:
      - web
    healthcheck:
      test: [ "CMD", "caddy", "version" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  my_network:
    driver: bridge

volumes:
  postgres_data:  # Том для хранения данных PostgreSQL
  static_data:
  media_data:
  caddy_data:
  caddy_config:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  django_secret_key:
    file: ./secrets/django_secret_key
  bot_token:
    file: ./secrets/bot_token
  bot_token_help:
    file: ./secrets/bot_token_help
  admin_password:
    file: ./secrets/admin_password
